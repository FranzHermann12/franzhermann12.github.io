
name: Sync GitHub to Codeberg

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg https://codeberg.org/Franz_Hermann1/franzhermann12.github.io.git

          AUTH=$(printf 'Franz_Hermann1:%s' "$CODEBERG_TOKEN" | base64 -w0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push codeberg HEAD:main
